name: Tarea técnica
description: Deuda técnica, refactor, mantenimiento o mejora interna sin cambio funcional
title: "[Task]: "
labels: ["chore", "triage"]
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Qué situación actual motiva esta tarea y por qué merece hacerse.
      placeholder: "La cobertura de test:coverage:check está en 85% y el equipo quiere subirla a 90% antes de aceptar nuevas features."
    validations:
      required: true

  - type: textarea
    id: alcance
    attributes:
      label: Alcance de la tarea
      description: Qué entra y qué NO entra en esta tarea.
      placeholder: |
        Incluye: agregar casos de prueba en test/ para las ramas sin cubrir
        y subir el umbral de test:coverage:check en package.json.
        No incluye: cambiar lógica de producción ni el contrato HTTP.
    validations:
      required: true

  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Lista verificable de condiciones para dar la tarea por terminada.
      placeholder: |
        - [ ] npm run test:coverage:check pasa con el nuevo umbral
        - [ ] No cambia ninguna respuesta de la API
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de tarea
      options:
        - Refactor
        - Deuda técnica
        - Dependencias / tooling
        - Infraestructura / CI-CD
        - Documentación
        - Tests
    validations:
      required: true
