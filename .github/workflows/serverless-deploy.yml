# Blue/green vía alias "live" con routing-config por peso (ver
# infra/terraform-aws-lambda): publica versión nueva, canary 10%, verifica
# contra la Function URL, promueve a 100% o revierte el alias. Se omite el
# deploy (sin fallar) si faltan credenciales de AWS.

name: Serverless Deploy - Prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-serverless-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  package:
    name: Empaquetar artefacto serverless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Validar el handler de Lambda localmente
        run: |
          npm run build
          DB_PATH=":memory:" node -e "
          import('./dist/serverless/aws.js').then(async (m) => {
            const health = await m.handler({ rawPath: '/health', requestContext: { http: { method: 'GET' } } });
            if (health.statusCode !== 200) throw new Error('GET /health -> ' + health.statusCode);
            const post = await m.handler({ rawPath: '/api/shorten', requestContext: { http: { method: 'POST' } }, body: JSON.stringify({ url: 'https://nodejs.org' }) });
            if (post.statusCode !== 201) throw new Error('POST /api/shorten -> ' + post.statusCode);
            console.log('Handler serverless OK: /health 200, /api/shorten 201');
          });
          "

      - name: Generar linker-serverless.zip
        run: bash infra/scripts/package-serverless.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linker-serverless-${{ github.sha }}
          path: linker-serverless.zip

  deploy:
    name: Deploy a AWS Lambda (PROD)
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: prod-serverless
    steps:
      - name: Verificar credenciales de AWS configuradas
        id: creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_REGION" ] && [ -n "$LAMBDA_FUNCTION_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy serverless omitido: faltan AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (secrets) o AWS_REGION/LAMBDA_FUNCTION_NAME (vars)."
          fi

      - uses: actions/download-artifact@v7
        if: steps.creds.outputs.enabled == 'true'
        with:
          name: linker-serverless-${{ github.sha }}

      - uses: aws-actions/configure-aws-credentials@v5
        if: steps.creds.outputs.enabled == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolver versión actual del alias estable
        id: current
        if: steps.creds.outputs.enabled == 'true'
        env:
          ALIAS: ${{ vars.LAMBDA_ALIAS_NAME || 'live' }}
        run: |
          set -euo pipefail
          CURRENT="$(aws lambda get-alias \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --name "$ALIAS" --query FunctionVersion --output text)"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Versión actual en el alias '$ALIAS': $CURRENT"

      - name: Publicar nueva versión del código
        id: publish
        if: steps.creds.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://linker-serverless.zip > /dev/null
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"
          NEW="$(aws lambda publish-version \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --query Version --output text)"
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" --qualifier "$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Nueva versión publicada: $NEW"

      - name: Iniciar canary (10% del tráfico a la nueva versión)
        if: steps.creds.outputs.enabled == 'true'
        env:
          ALIAS: ${{ vars.LAMBDA_ALIAS_NAME || 'live' }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          NEW_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          aws lambda update-alias \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --name "$ALIAS" \
            --function-version "$CURRENT_VERSION" \
            --routing-config "{\"AdditionalVersionWeights\":{\"$NEW_VERSION\":0.1}}" > /dev/null
          echo "Canary activo: 90% v$CURRENT_VERSION / 10% v$NEW_VERSION"

      - name: Verificar canary contra la Function URL
        id: canary
        if: steps.creds.outputs.enabled == 'true' && vars.LAMBDA_FUNCTION_URL != ''
        run: |
          set -euo pipefail
          URL="${{ vars.LAMBDA_FUNCTION_URL }}"
          URL="${URL%/}"
          for i in $(seq 1 20); do
            curl -sf "$URL/health" > /dev/null || { echo "::error::Fallo en la petición $i/20 durante el canary"; exit 1; }
            sleep 1
          done
          echo "Canary saludable: 20/20 peticiones OK contra $URL/health"

      - name: Promover la nueva versión a 100% del tráfico
        if: steps.creds.outputs.enabled == 'true' && vars.LAMBDA_FUNCTION_URL != ''
        env:
          ALIAS: ${{ vars.LAMBDA_ALIAS_NAME || 'live' }}
          NEW_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          aws lambda update-alias \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --name "$ALIAS" \
            --function-version "$NEW_VERSION" \
            --routing-config '{"AdditionalVersionWeights":{}}' > /dev/null
          echo "Promovida v$NEW_VERSION a 100% del tráfico en el alias '$ALIAS'"

      - name: Rollback del alias si el canary falló
        if: steps.creds.outputs.enabled == 'true' && vars.LAMBDA_FUNCTION_URL != '' && steps.canary.outcome == 'failure'
        env:
          ALIAS: ${{ vars.LAMBDA_ALIAS_NAME || 'live' }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          aws lambda update-alias \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --name "$ALIAS" \
            --function-version "$CURRENT_VERSION" \
            --routing-config '{"AdditionalVersionWeights":{}}' > /dev/null
          echo "::error::Canary falló; rollback aplicado a v$CURRENT_VERSION (100%) en el alias '$ALIAS'"

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.enabled == 'true' && vars.LAMBDA_FUNCTION_URL != ''
        with:
          python-version: "3.12"

      - name: Verificar configuración de Grafana
        id: grafana-config
        if: steps.creds.outputs.enabled == 'true' && vars.LAMBDA_FUNCTION_URL != ''
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
        run: |
          if [ -z "$GRAFANA_URL" ] || [ -z "$GRAFANA_API_TOKEN" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gate de Grafana OMITIDO: configure vars.GRAFANA_URL, vars.GRAFANA_DATASOURCE_UID y secrets.GRAFANA_API_TOKEN para activarlo."
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Esperar ventana de observación post-promoción
        if: steps.grafana-config.outputs.configurado == 'true'
        run: |
          ESPERA="${{ vars.GRAFANA_WAIT_SECONDS || '60' }}"
          echo "Dejando correr tráfico real ${ESPERA}s antes de evaluar métricas..."
          sleep "$ESPERA"

      - name: Gate de Grafana post-promoción
        id: grafana-gate
        if: steps.grafana-config.outputs.configurado == 'true'
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_DATASOURCE_UID: ${{ vars.GRAFANA_DATASOURCE_UID }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
        run: |
          EXTRA_ARGS=()
          if [ -n "${{ vars.GRAFANA_P95_QUERY }}" ]; then
            EXTRA_ARGS+=(--p95-query "${{ vars.GRAFANA_P95_QUERY }}")
          fi
          if [ -n "${{ vars.GRAFANA_ERROR_RATE_QUERY }}" ]; then
            EXTRA_ARGS+=(--error-rate-query "${{ vars.GRAFANA_ERROR_RATE_QUERY }}" \
                         --max-error-rate "${{ vars.GRAFANA_MAX_ERROR_RATE || '0.05' }}")
          fi
          python3 scripts/check_grafana.py \
            --window "${{ vars.GRAFANA_WINDOW || '10m' }}" \
            --max-p95-ms "${{ vars.GRAFANA_MAX_P95_MS || '500' }}" \
            "${EXTRA_ARGS[@]}"

      - name: Rollback del alias si el gate de Grafana falló
        if: steps.grafana-config.outputs.configurado == 'true' && steps.grafana-gate.outcome == 'failure'
        env:
          ALIAS: ${{ vars.LAMBDA_ALIAS_NAME || 'live' }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          aws lambda update-alias \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --name "$ALIAS" \
            --function-version "$CURRENT_VERSION" \
            --routing-config '{"AdditionalVersionWeights":{}}' > /dev/null
          echo "::error::Gate de Grafana falló tras promover; rollback aplicado a v$CURRENT_VERSION (100%) en el alias '$ALIAS'"

      - name: Promover sin canary (sin Function URL configurada para verificar)
        if: steps.creds.outputs.enabled == 'true' && vars.LAMBDA_FUNCTION_URL == ''
        env:
          ALIAS: ${{ vars.LAMBDA_ALIAS_NAME || 'live' }}
          NEW_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          aws lambda update-alias \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --name "$ALIAS" \
            --function-version "$NEW_VERSION" \
            --routing-config '{"AdditionalVersionWeights":{}}' > /dev/null
          echo "::warning::LAMBDA_FUNCTION_URL no configurada: se promovió v$NEW_VERSION directo a 100% sin verificación de canary."
