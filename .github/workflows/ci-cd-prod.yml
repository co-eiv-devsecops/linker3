name: CI/CD - Prod

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  APP_NAME: linker
  ENVIRONMENT: prod
  PROD_URL: https://3.n-la-c.app

jobs:
  lint:
    name: Lint y calidad de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Verificar tipos (tsc --noEmit)
        run: npm run typecheck

      - name: Análisis de estilo (Biome)
        run: npx biome ci .

  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Ejecutar tests
        run: npm test

      - name: Reporte de cobertura (bloquea si < 85%)
        run: npm run test:coverage:check | tee coverage.txt

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report-prod-${{ github.sha }}
          path: coverage.txt

  security-scan:
    name: Escaneo de seguridad
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Auditoría de dependencias (bloquea en vulnerabilidades altas)
        run: npm audit --audit-level=high

      - name: Escaneo de secretos (pendiente gitleaks)
        run: echo "Pendiente implementar gitleaks"

      - name: Análisis SAST (pendiente CodeQL)
        run: echo "Pendiente implementar CodeQL"

      - name: Validar cumplimiento (gate bloqueante)
        run: |
          echo 'Pendiente: en prod cualquier hallazgo critico detiene el pipeline'

  build:
    name: Build y empaquetado
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Validar arranque de la aplicación
        run: |
          PORT=3000 DB_PATH=/tmp/linker.db node src/main.ts &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/ > /dev/null
          kill $SERVER_PID

      - name: Construir imagen Docker
        run: docker build -f infra/docker/Dockerfile -t ${{ env.APP_NAME }}:${{ github.sha }} .

      - name: Empaquetar imagen como artefacto
        run: docker save ${{ env.APP_NAME }}:${{ github.sha }} -o ${{ env.APP_NAME }}-${{ github.sha }}.tar

      - uses: actions/upload-artifact@v4
        with:
          name: linker-prod-${{ github.sha }}
          path: ${{ env.APP_NAME }}-${{ github.sha }}.tar

      - name: Empaquetar fuentes para despliegue en VM
        run: |
          mkdir -p deploy-src
          cp -r src public package.json deploy-src/

      - uses: actions/upload-artifact@v4
        with:
          name: linker-src-prod-${{ github.sha }}
          path: deploy-src/

  publish-image:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determinar tags de la imagen
        id: tags
        run: |
          TAGS="${{ env.IMAGE }}:${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="$TAGS,${{ env.IMAGE }}:${VERSION}"
          else
            TAGS="$TAGS,${{ env.IMAGE }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy-prod:
    name: Deploy a Producción
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: prod
      url: https://3.n-la-c.app
    permissions:
      contents: read
      actions: read
    env:
      DEPLOYMENT_PRIVATE_KEY: ${{ secrets.DEPLOYMENT_PRIVATE_KEY }}
      DEPLOYMENT_PUBLIC_KEY: ${{ vars.DEPLOYMENT_PUBLIC_KEY }}
      OCI_BASTION_OCID: ${{ vars.OCI_BASTION_OCID }}
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ vars.OCI_CLI_REGION }}
    steps:
      - uses: co-eiv-devsecops/material-curso/actions/oci-bastion-deploy@main
        with:
          instance-id: ${{ vars.OCI_INSTANCE_OCID }}
          artifact-name: linker-src-prod-${{ github.sha }}
          target-path: /opt/linker
          target-os-username: ubuntu
          script: |
            set -euo pipefail
            sudo systemctl restart linker
            sudo systemctl is-active --quiet linker
            curl -sf https://3.n-la-c.app/health
            echo "Despliegue exitoso en producción — sha: $DEPLOY_PATH"

  api-tests:
    name: Pruebas de API (Newman)
    runs-on: ubuntu-latest
    needs: deploy-prod
    steps:
      - uses: actions/checkout@v4

      - name: Verificar si existe la colección Postman
        id: check
        run: |
          if [ -f "postman/linker.postman_collection.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Colección Postman no encontrada, omitiendo pruebas de API"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Ejecutar colección Postman contra producción
        if: steps.check.outputs.exists == 'true'
        run: |
          npx newman run postman/linker.postman_collection.json \
            --env-var baseUrl=${{ env.PROD_URL }} \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.exists == 'true'
        with:
          name: newman-report-prod-${{ github.sha }}
          path: newman-report.xml

  rollback:
    name: Rollback automático
    runs-on: ubuntu-latest
    needs: [deploy-prod, api-tests]
    if: failure()
    steps:
      - name: Alerta de rollback requerido
        run: |
          echo "::error::El despliegue o las pruebas fallaron en el sha ${{ github.sha }}"
          echo "Para hacer rollback manual en la VM:"
          echo "  ssh ubuntu@<VM> 'sudo systemctl stop linker'"
          echo "  ssh ubuntu@<VM> 'git -C /opt/linker checkout HEAD~1 -- src/ public/'"
          echo "  ssh ubuntu@<VM> 'sudo systemctl start linker'"
          echo "O re-ejecutar el pipeline sobre el commit anterior desde Actions."

  notify:
    name: Notificar y crear release
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.deploy-prod.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar que el tag apunta a main
        run: |
          git fetch origin main --depth=1
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF")"
          if git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "El tag pertenece a main"
          else
            echo "::error::El tag no apunta a un commit contenido en main"
            exit 1
          fi

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true

      - name: Notificar al equipo
        run: |
          echo "Pipeline prod finalizado"
          echo "Deploy: ${{ needs.deploy-prod.result }}"
          echo "Release creado para: ${{ github.ref_name }}"
