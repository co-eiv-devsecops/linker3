name: Link Check

# Falla si se introduce un link http(s) externo en docs sin pasar antes por el acortador propio (scripts/shorten_wiki_links.py).

on:
  push:
    paths:
      - "**/*.md"
      - "**/*.tex"
      - "scripts/shorten_wiki_links.py"
      - "scripts/shorten_wiki_links.allowlist"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.tex"
      - "scripts/shorten_wiki_links.py"
      - "scripts/shorten_wiki_links.allowlist"

concurrency:
  group: link-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Verificar que los links externos estén acortados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar links http(s) sin acortar
        run: python3 scripts/shorten_wiki_links.py --check
