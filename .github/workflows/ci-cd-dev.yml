name: CI/CD - Dev

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml
    with:
      artifact-suffix: dev
    permissions:
      contents: read
      security-events: write
      actions: read
