name: CI/CD - Dev

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  APP_NAME: linker
  ENVIRONMENT: dev

jobs:
  lint:
    name: Lint y calidad de código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis (node --check)
        run: |
          node --check server.js
          for f in src/*.js; do node --check "$f"; done

      - name: Análisis de estilo
        run: echo "Hello World - análisis estático de código"

  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

      - name: Reporte de cobertura
        run: npm run test:coverage | tee coverage.txt

      - name: Publicar resultados de tests
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.txt

  security-scan:
    name: Escaneo de seguridad
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del código
        run: echo "Hello World - checkout del repositorio"

      - name: Escaneo de secretos
        run: echo "Hello World - escaneo de secretos (gitleaks / trufflehog)"

      - name: Análisis SAST
        run: echo "Hello World - análisis estático de seguridad (CodeQL / semgrep)"

      - name: Escaneo de IaC (Terraform / cloud-init)
        run: echo "Hello World - tfsec/checkov sobre infra/terraform-oracle y cloud-init.yaml"

  build:
    name: Build y empaquetado
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar arranque de la aplicación
        run: |
          PORT=3000 DB_PATH=/tmp/linker.db node server.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/ > /dev/null
          kill $SERVER_PID

      - name: Construir imagen Docker (empaquetamiento para Linux)
        run: docker build -f infra/docker/Dockerfile -t ${{ env.APP_NAME }}:${{ github.sha }} .

      - name: Empaquetar imagen como artefacto
        run: docker save ${{ env.APP_NAME }}:${{ github.sha }} -o ${{ env.APP_NAME }}-${{ github.sha }}.tar

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: linker-dev-${{ github.sha }}
          path: ${{ env.APP_NAME }}-${{ github.sha }}.tar

  deploy-dev:
    name: Deploy a Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: dev
      url: http://dev.n-la-c.app
    steps:
      - name: Configurar llave SSH
        run: echo "Hello World - cargar secret SSH_PRIVATE_KEY_DEV (linkervm-dev.key)"

      - name: Actualizar código en la VM de dev
        run: echo "Hello World - ssh ubuntu@VM_DEV 'cd /opt/linker && git pull origin develop'"

      - name: Reiniciar servicio
        run: echo "Hello World - ssh ubuntu@VM_DEV 'sudo systemctl restart linker'"

      - name: Verificar estado del servicio
        run: echo "Hello World - ssh ubuntu@VM_DEV 'sudo systemctl status linker --no-pager'"

  notify:
    name: Notificar resultado
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: always()
    steps:
      - name: Notificar al equipo
        run: echo "Hello World - notificación (Slack/correo) del resultado del pipeline dev"
