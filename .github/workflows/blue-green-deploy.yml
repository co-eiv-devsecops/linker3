name: Blue Green Deployment (Simulado)

on:
  push:
    branches: [feature/blue-green-deployment]
  workflow_dispatch:
    inputs:
      color_activo_inicial:
        description: "Color activo actual"
        required: true
        default: azul
        type: choice
        options:
          - azul
          - verde
      simular_fallo_post_lanzamiento:
        description: "Simular fallo despues de mover trafico"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      accion_entorno_anterior:
        description: "Que hacer con el entorno anterior"
        required: true
        default: mantener
        type: choice
        options:
          - mantener
          - redeploy
          - destruir

concurrency:
  group: blue-green-demo
  cancel-in-progress: false

jobs:
  preparar-escenario:
    name: Preparar escenario activo/inactivo
    runs-on: ubuntu-latest
    outputs:
      activo: ${{ steps.definir.outputs.activo }}
      inactivo: ${{ steps.definir.outputs.inactivo }}
      simular_fallo_post_lanzamiento: ${{ steps.definir.outputs.simular_fallo_post_lanzamiento }}
      accion_entorno_anterior: ${{ steps.definir.outputs.accion_entorno_anterior }}
    steps:
      - name: Definir colores y parametros
        id: definir
        run: |
          ACTIVO="${{ github.event.inputs.color_activo_inicial }}"
          FALLO_POST="${{ github.event.inputs.simular_fallo_post_lanzamiento }}"
          ACCION_ANTERIOR="${{ github.event.inputs.accion_entorno_anterior }}"

          if [ -z "$ACTIVO" ]; then ACTIVO="azul"; fi
          if [ -z "$FALLO_POST" ]; then FALLO_POST="false"; fi
          if [ -z "$ACCION_ANTERIOR" ]; then ACCION_ANTERIOR="mantener"; fi

          if [ "$ACTIVO" = "azul" ]; then
            INACTIVO="verde"
          else
            INACTIVO="azul"
          fi

          echo "Escenario base: $ACTIVO activo, $INACTIVO inactivo"
          echo "activo=$ACTIVO" >> "$GITHUB_OUTPUT"
          echo "inactivo=$INACTIVO" >> "$GITHUB_OUTPUT"
          echo "simular_fallo_post_lanzamiento=$FALLO_POST" >> "$GITHUB_OUTPUT"
          echo "accion_entorno_anterior=$ACCION_ANTERIOR" >> "$GITHUB_OUTPUT"

  despliegue-en-inactivo:
    name: 1) Despliegue en entorno inactivo (simulado)
    runs-on: ubuntu-latest
    needs: preparar-escenario
    environment:
      name: dev
    steps:
      - name: Simular despliegue
        run: |
          echo "Desplegando nueva version en ${{ needs.preparar-escenario.outputs.inactivo }}"
          echo "Sin impacto en trafico porque sigue activo ${{ needs.preparar-escenario.outputs.activo }}"

  qa-en-inactivo:
    name: 2) QA en entorno inactivo (simulado)
    runs-on: ubuntu-latest
    needs: [preparar-escenario, despliegue-en-inactivo]
    environment:
      name: dev
    steps:
      - name: Simular pruebas QA
        run: |
          echo "Ejecutando QA en ${{ needs.preparar-escenario.outputs.inactivo }}"
          echo "QA completada en entorno inactivo"

  aprobar-cambio:
    name: 3) Aprobacion manual para mover trafico
    runs-on: ubuntu-latest
    needs: [preparar-escenario, qa-en-inactivo]
    environment:
      name: prod
    steps:
      - name: Esperar aprobacion manual
        run: |
          echo "Aprobacion requerida para el lanzamiento"
          echo "Se movera trafico de ${{ needs.preparar-escenario.outputs.activo }} a ${{ needs.preparar-escenario.outputs.inactivo }}"

  cambiar-trafico:
    name: 4) Redireccionar trafico al inactivo (lanzamiento simulado)
    runs-on: ubuntu-latest
    needs: [preparar-escenario, aprobar-cambio]
    environment:
      name: prod
    outputs:
      nuevo_activo: ${{ steps.cambio.outputs.nuevo_activo }}
      entorno_anterior: ${{ steps.cambio.outputs.entorno_anterior }}
    steps:
      - name: Simular redireccionamiento
        id: cambio
        run: |
          echo "Redireccionando trafico de ${{ needs.preparar-escenario.outputs.activo }} a ${{ needs.preparar-escenario.outputs.inactivo }}"
          echo "nuevo_activo=${{ needs.preparar-escenario.outputs.inactivo }}" >> "$GITHUB_OUTPUT"
          echo "entorno_anterior=${{ needs.preparar-escenario.outputs.activo }}" >> "$GITHUB_OUTPUT"
          echo "Lanzamiento completado"

  validar-post-lanzamiento:
    name: 5) Validar nuevo activo (simulado)
    runs-on: ubuntu-latest
    needs: [preparar-escenario, cambiar-trafico]
    steps:
      - name: Simular validacion despues del cambio
        run: |
          echo "Validando entorno activo: ${{ needs.cambiar-trafico.outputs.nuevo_activo }}"
          if [ "${{ needs.cambiar-trafico.outputs.nuevo_activo }}" = "verde" ] && [ "${{ needs.preparar-escenario.outputs.simular_fallo_post_lanzamiento }}" = "true" ]; then
            echo "Fallo simulado en VERDE despues del lanzamiento"
            exit 1
          fi
          echo "Validacion correcta en el nuevo activo"

  aprobar-rollback:
    name: 6) Aprobacion manual de rollback a azul
    runs-on: ubuntu-latest
    needs: [cambiar-trafico, validar-post-lanzamiento]
    if: always() && needs.cambiar-trafico.outputs.nuevo_activo == 'verde' && needs.validar-post-lanzamiento.result == 'failure'
    environment:
      name: prod
    steps:
      - name: Esperar aprobacion de rollback
        run: |
          echo "El nuevo activo verde fallo"
          echo "Se solicita aprobacion manual para volver trafico a azul"

  rollback-a-azul:
    name: 7) Rollback a azul (simulado)
    runs-on: ubuntu-latest
    needs: [aprobar-rollback]
    if: always() && needs.aprobar-rollback.result == 'success'
    environment:
      name: prod
    steps:
      - name: Simular rollback
        run: |
          echo "Aplicando rollback"
          echo "Trafico restaurado a azul"
          echo "Rollback completado"

  gestionar-entorno-anterior:
    name: 8) Gestionar entorno anterior (simulado)
    runs-on: ubuntu-latest
    needs: [preparar-escenario, cambiar-trafico, validar-post-lanzamiento]
    if: needs.validar-post-lanzamiento.result == 'success'
    steps:
      - name: Simular accion sobre entorno anterior
        run: |
          ANTERIOR="${{ needs.cambiar-trafico.outputs.entorno_anterior }}"
          ACCION="${{ needs.preparar-escenario.outputs.accion_entorno_anterior }}"
          echo "Entorno anterior: $ANTERIOR"
          if [ "$ACCION" = "redeploy" ]; then
            echo "Accion: redeploy en $ANTERIOR para dejarlo listo como inactivo"
          elif [ "$ACCION" = "destruir" ]; then
            echo "Accion: destruir $ANTERIOR"
          else
            echo "Accion: mantener $ANTERIOR"
          fi

  resumen:
    name: Resumen final del flujo
    runs-on: ubuntu-latest
    needs:
      - preparar-escenario
      - despliegue-en-inactivo
      - qa-en-inactivo
      - aprobar-cambio
      - cambiar-trafico
      - validar-post-lanzamiento
      - aprobar-rollback
      - rollback-a-azul
      - gestionar-entorno-anterior
    if: always()
    steps:
      - name: Mostrar resumen
        run: |
          echo "Blue/Green simulado completado"
          echo "Activo inicial: ${{ needs.preparar-escenario.outputs.activo }}"
          echo "Inactivo inicial: ${{ needs.preparar-escenario.outputs.inactivo }}"
          echo "Nuevo activo tras lanzamiento: ${{ needs.cambiar-trafico.outputs.nuevo_activo }}"
          echo "Despliegue inactivo: ${{ needs.despliegue-en-inactivo.result }}"
          echo "QA inactivo: ${{ needs.qa-en-inactivo.result }}"
          echo "Aprobacion cambio: ${{ needs.aprobar-cambio.result }}"
          echo "Cambio de trafico: ${{ needs.cambiar-trafico.result }}"
          echo "Validacion post lanzamiento: ${{ needs.validar-post-lanzamiento.result }}"
          echo "Aprobacion rollback: ${{ needs.aprobar-rollback.result }}"
          echo "Rollback a azul: ${{ needs.rollback-a-azul.result }}"
          echo "Gestion entorno anterior: ${{ needs.gestionar-entorno-anterior.result }}"
