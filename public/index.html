<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linker — Acortador de URLs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='68' font-size='52' text-anchor='middle'>🔗</text></svg>">
<style>
:root {
  --bg: #f4f4f8;
  --bg-gradient: radial-gradient(1200px 600px at 50% -10%, #e4e2ff 0%, #f4f4f8 55%);
  --card: #ffffff;
  --border: #e5e7eb;
  --border-focus: #4f46e5;
  --text: #111118;
  --text-2: #374151;
  --text-3: #6b7280;
  --text-4: #9ca3af;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: rgba(79,70,229,.1);
  --ok: #16a34a;
  --err-bg: #fef2f2;
  --err-border: #fecaca;
  --err-text: #991b1b;
  --row: #f3f4f6;
  --shadow: 0 1px 2px rgba(17,17,24,.04), 0 8px 32px rgba(17,17,24,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f14;
    --bg-gradient: radial-gradient(1200px 600px at 50% -10%, #1e1b3a 0%, #0f0f14 55%);
    --card: #17171f;
    --border: #2a2a35;
    --border-focus: #818cf8;
    --text: #f3f4f6;
    --text-2: #d1d5db;
    --text-3: #9ca3af;
    --text-4: #6b7280;
    --accent: #818cf8;
    --accent-hover: #a5b4fc;
    --accent-soft: rgba(129,140,248,.15);
    --ok: #22c55e;
    --err-bg: #2a1215;
    --err-border: #7f1d1d;
    --err-text: #fca5a5;
    --row: #22222c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 32px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  background-image: var(--bg-gradient);
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 40px 36px;
  width: 100%; max-width: 500px;
}
.logo { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #6366f1, #4f46e5);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.15rem;
  box-shadow: 0 4px 12px rgba(79,70,229,.35);
}
h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; }
.tagline { color: var(--text-3); font-size: .9rem; margin-bottom: 28px; }
label { display: block; font-size: .82rem; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
label span { font-weight: 400; color: var(--text-4); }
input {
  width: 100%; padding: 12px 14px;
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: .95rem; color: var(--text);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-soft); }
input::placeholder { color: var(--text-4); }
.field { margin-bottom: 14px; }
button {
  margin-top: 4px; width: 100%; padding: 13px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 10px;
  font-size: .95rem; font-weight: 600; cursor: pointer;
  transition: background .15s, transform .1s;
}
button:hover { background: var(--accent-hover); }
button:active { transform: scale(.985); }
button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
#result {
  display: none; margin-top: 14px;
  background: var(--accent-soft);
  border: 1.5px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
  align-items: center; gap: 8px;
  animation: pop .2s ease-out;
}
#result.show { display: flex; }
@keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
#short { flex: 1; font-size: .92rem; color: var(--accent); font-weight: 600; word-break: break-all; text-decoration: none; }
#short:hover { text-decoration: underline; }
#copy { margin-top: 0; width: auto; padding: 7px 14px; font-size: .82rem; flex-shrink: 0; }
#copy.done { background: var(--ok); }
#err {
  display: none; margin-top: 10px; padding: 9px 14px;
  border-radius: 8px; font-size: .88rem;
  background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err-text);
}
#err.show { display: block; animation: pop .2s ease-out; }
.links-section { margin-top: 28px; border-top: 1.5px solid var(--border); padding-top: 20px; }
.links-section h2 {
  font-size: .78rem; font-weight: 700; color: var(--text-3);
  margin-bottom: 12px; text-transform: uppercase; letter-spacing: .07em;
}
.link-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; margin: 0 -10px;
  border-radius: 8px;
  transition: background .12s;
}
.link-item:hover { background: var(--row); }
.link-short {
  font-size: .88rem; color: var(--accent); font-weight: 600; text-decoration: none;
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.link-short:hover { text-decoration: underline; }
.link-orig {
  flex: 1; font-size: .78rem; color: var(--text-4);
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.link-visits {
  font-size: .72rem; font-weight: 600; color: var(--text-3);
  background: var(--row); border-radius: 999px;
  padding: 3px 9px; white-space: nowrap; flex-shrink: 0;
}
#links-empty { font-size: .85rem; color: var(--text-4); text-align: center; padding: 14px 0; }
footer { margin-top: 24px; text-align: center; font-size: .75rem; color: var(--text-4); }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="icon">&#128279;</div><h1>Linker</h1></div>
  <p class="tagline">Acorta cualquier URL al instante</p>
  <div class="field">
    <label for="urlInput">URL a acortar</label>
    <input id="urlInput" type="url" placeholder="https://ejemplo.com/url-muy-larga">
  </div>
  <div class="field">
    <label for="aliasInput">Alias personalizado <span>(opcional)</span></label>
    <input id="aliasInput" type="text" placeholder="mi-enlace (letras, números, - y _)">
  </div>
  <button id="btn" onclick="acortar()">Acortar URL</button>
  <div id="result">
    <a id="short" href="#" target="_blank" rel="noopener"></a>
    <button id="copy" onclick="copiar()">Copiar</button>
  </div>
  <div id="err"></div>
  <div class="links-section">
    <h2>Links creados</h2>
    <div id="links-list"><div id="links-empty">Aún no hay links</div></div>
  </div>
</div>
<script>
var urlInput = document.getElementById('urlInput');
var aliasInput = document.getElementById('aliasInput');
var btn = document.getElementById('btn');
var result = document.getElementById('result');
var shortEl = document.getElementById('short');
var copyBtn = document.getElementById('copy');
var errEl = document.getElementById('err');
var linksList = document.getElementById('links-list');

// Construye cada fila con createElement/textContent — nunca con innerHTML —
// porque l.url viene del usuario y concatenarla como HTML permite XSS almacenado.
function filaLink(l) {
  var short = window.location.origin + '/' + l.code;

  var item = document.createElement('div');
  item.className = 'link-item';

  var a = document.createElement('a');
  a.className = 'link-short';
  a.href = short;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = short;

  var orig = document.createElement('span');
  orig.className = 'link-orig';
  orig.title = l.url;
  orig.textContent = l.url;

  var visits = document.createElement('span');
  visits.className = 'link-visits';
  visits.textContent = l.visits + (l.visits === 1 ? ' visita' : ' visitas');

  item.append(a, orig, visits);
  return item;
}

async function cargarLinks() {
  try {
    var r = await fetch('/api/links');
    var links = await r.json();
    linksList.replaceChildren();
    if (!links.length) {
      var empty = document.createElement('div');
      empty.id = 'links-empty';
      empty.textContent = 'Aún no hay links';
      linksList.append(empty);
      return;
    }
    links.forEach(function(l) { linksList.append(filaLink(l)); });
  } catch (e) {}
}

cargarLinks();

urlInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') acortar();
});
aliasInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') acortar();
});

async function acortar() {
  var url = urlInput.value.trim();
  var alias = aliasInput.value.trim();
  if (!url) return;

  btn.disabled = true;
  btn.textContent = 'Acortando...';
  result.className = '';
  errEl.className = '';

  var payload = { url: url };
  if (alias) payload.alias = alias;

  try {
    var r = await fetch('/api/shorten', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var d = await r.json();
    if (r.ok) {
      shortEl.textContent = d.short;
      shortEl.href = d.short;
      result.className = 'show';
      copyBtn.textContent = 'Copiar';
      copyBtn.className = '';
      urlInput.value = '';
      aliasInput.value = '';
      cargarLinks();
    } else {
      errEl.textContent = d.error;
      errEl.className = 'show';
    }
  } catch (e) {
    errEl.textContent = 'Error de conexión';
    errEl.className = 'show';
  }

  btn.disabled = false;
  btn.textContent = 'Acortar URL';
}

function copiar() {
  navigator.clipboard.writeText(shortEl.textContent).then(function() {
    copyBtn.textContent = '¡Copiado!';
    copyBtn.className = 'done';
    setTimeout(function() {
      copyBtn.textContent = 'Copiar';
      copyBtn.className = '';
    }, 2000);
  });
}
</script>
</body>
</html>
